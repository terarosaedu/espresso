<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
  <title>에스프레소 베리에이션 실습 노트</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 입장 -->
  <div id="login" class="shell" hidden>
    <div class="login-wrap">
      <img src="assets/logo.png" class="logo logo-lg" alt="TERAROSA">
      <h1 class="login-title">에스프레소 베리에이션<br>실습 노트</h1>
      <p class="muted">실습 중에 받은 피드백을 직접 기록하고, 연습할 때마다 다시 꺼내 보세요.</p>
      <form id="loginForm" class="stack" novalidate>
        <label class="field"><span>기수 코드</span>
          <input id="codeInput" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
        </label>
        <label class="field"><span>이름</span>
          <input id="nameInput" autocomplete="name" required>
        </label>
        <p id="loginError" class="error" hidden></p>
        <button id="loginBtn" class="btn btn-primary btn-block" type="submit">입장하기</button>
      </form>
    </div>
  </div>

  <!-- 앱 -->
  <div id="app" hidden>
    <div class="shell">
      <header class="topbar">
        <img src="assets/logo.png" class="logo" alt="TERAROSA">
        <button id="logoutBtn" class="link-btn" type="button">나가기</button>
      </header>
      <section class="hero">
        <p class="hero-name"><span id="studentName"></span>님, 오늘도 한 잔씩</p>
        <h1 id="dayTitle" class="hero-day"></h1>
        <div class="day-track" id="dayTrack"><span></span><span></span><span></span></div>
        <div class="day-track-labels" id="dayLabels"></div>
      </section>

      <main class="views">
        <!-- 기록 -->
        <section class="view" id="view-record">
          <div id="attendanceBox"></div>

          <div class="form-block">
            <div class="segmented" id="catTabs" role="tablist" aria-label="메뉴"></div>
            <form id="fbForm" class="form-block" novalidate>
              <div>
                <p class="label">어떤 부분에 대한 피드백인가요?<small>여러 개 선택 가능</small></p>
                <div id="chipArea"></div>
              </div>
              <label class="field"><span>피드백 내용</span>
                <textarea id="memoInput" rows="4" placeholder="강사님이 짚어 준 점과 다음에 바꿔 볼 방법을 적어 주세요."></textarea>
              </label>
              <button id="fbSave" class="btn btn-primary btn-block" type="submit">기록 저장</button>
            </form>
          </div>

          <div class="form-block">
            <div class="section-head">
              <h2 class="section-title" id="recentTitle"></h2>
              <button class="link-btn" type="button" data-goto="review">전체 보기</button>
            </div>
            <ul class="fb-list" id="recentList"></ul>
          </div>
        </section>

        <!-- 모아보기 -->
        <section class="view" id="view-review" hidden>
          <div class="filter" id="reviewFilter">
            <button class="chip" type="button" data-filter="all" aria-pressed="true">전체</button>
            <button class="chip" type="button" data-filter="open" aria-pressed="false">연습 중</button>
            <button class="chip" type="button" data-filter="resolved" aria-pressed="false">교정됨</button>
          </div>
          <div id="reviewBody" class="form-block"></div>
        </section>

        <!-- 마무리 -->
        <section class="view" id="view-finish" hidden>
          <ol class="steps">
            <li class="step">
              <div class="step-head"><h2>피드백 돌아보기</h2></div>
              <p id="finishSummary" class="muted"></p>
              <button class="btn btn-block" type="button" data-goto="review">내 피드백 모아보기</button>
            </li>
            <li class="step">
              <div class="step-head"><h2>베스트 사진 첨부</h2></div>
              <ul class="guide">
                <li>잔을 저울 위에 올려 주세요.</li>
                <li>바로 위에서 내려다보며, 잔과 저울 숫자가 함께 나오게 세로로 찍어 주세요.</li>
                <li>메뉴별로 가장 잘 만든 한 잔을 골라 주세요. 다시 올리면 바뀌어요.</li>
              </ul>
              <div id="photoArea" class="form-block"></div>
            </li>
            <li class="step">
              <div class="step-head"><h2>교육 만족도 조사</h2></div>
              <div id="surveyArea"></div>
            </li>
          </ol>
        </section>
      </main>
    </div>

    <nav class="tabbar" aria-label="화면 이동">
      <div class="tabbar-inner">
        <button type="button" data-view="record" class="active">기록</button>
        <button type="button" data-view="review">모아보기</button>
        <button type="button" data-view="finish">마무리</button>
      </div>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
